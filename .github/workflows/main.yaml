name: CI

on:
  push:
    branches: [ main, master ]

env:
  REGISTRY: "docker.io"
  IMAGE_NAME: "tinvest"
  CONTAINER_NAME: "tinvest-container"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  image-build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        run: docker login -u ${{ secrets.REGISTRY_USERNAME }} -p ${{ secrets.REGISTRY_PASSWORD }} $REGISTRY

      - name: Build and Push Docker Image
        run: |
          TAG_NAME=$(echo $GITHUB_SHA | head -c7)
          docker buildx create --use
          docker buildx build --no-cache --push --tag $REGISTRY/koshelevoleg/$IMAGE_NAME:$TAG_NAME .
  deploy-image:
    runs-on: ubuntu-latest
    needs: image-build-and-push

    steps:
      - name: Deploy to SSH action
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSHKEY }}
          envs: IMAGE_NAME,REGISTRY,GITHUB_SHA,CONTAINER_NAME
          script: |
            # Set up variables
            TAG_NAME=$(echo $GITHUB_SHA | head -c7)
            
            # Login into Registry
            docker login -u ${{ secrets.REGISTRY_USERNAME }} -p ${{ secrets.REGISTRY_PASSWORD }} $REGISTRY

            # Stop running container
            docker stop $CONTAINER_NAME

            # Remove old container
            docker rm $CONTAINER_NAME

            # Run a new container from a new image
            docker run -e T_BANK=${{ secrets.T_BANK }} -e PORTFOLIO_YTD_START_VALUE=463402 -e PROFILES=${{ secrets.PROFILES }} -e TELEGRAM=${{ secrets.TELEGRAM }} -d -p 50051:50051 --name $CONTAINER_NAME -t $REGISTRY/koshelevoleg/$IMAGE_NAME:$TAG_NAME