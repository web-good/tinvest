name: CI

on:
  push:
    branches: [ main, master, "**" ]
  pull_request:

env:
  REGISTRY: "docker.io"
  IMAGE_NAME: "tinvest"
  CONTAINER_NAME: "tinvest-container"
  STATE_VOLUME: "tinvest-state"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Download modules
        run: go mod download || go mod download
      - name: Install tools
        run: go run github.com/magefile/mage tools
      - name: Lint
        run: go run github.com/magefile/mage lint

  mock-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Download modules
        run: go mod download || go mod download
      - name: Install tools
        run: go run github.com/magefile/mage tools
      - name: Mock drift
        run: go run github.com/magefile/mage mocksCheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Download modules
        run: go mod download || go mod download
      - name: Test
        run: go run github.com/magefile/mage test

  image-build-and-push:
    runs-on: ubuntu-latest
    needs: [ lint, mock-drift, test ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        run: docker login -u ${{ secrets.REGISTRY_USERNAME }} -p ${{ secrets.REGISTRY_PASSWORD }} $REGISTRY

      - name: Build and Push Docker Image
        run: |
          TAG_NAME=$(echo $GITHUB_SHA | head -c7)
          docker buildx create --use
          docker buildx build --no-cache --push --tag $REGISTRY/koshelevoleg/$IMAGE_NAME:$TAG_NAME .
  deploy-image:
    runs-on: ubuntu-latest
    needs: image-build-and-push

    steps:
      - name: Deploy to SSH action
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSHKEY }}
          envs: IMAGE_NAME,REGISTRY,GITHUB_SHA,CONTAINER_NAME,STATE_VOLUME
          script: |
            # Set up variables
            TAG_NAME=$(echo $GITHUB_SHA | head -c7)
            
            # Login into Registry
            docker login -u ${{ secrets.REGISTRY_USERNAME }} -p ${{ secrets.REGISTRY_PASSWORD }} $REGISTRY

            # Stop running container
            docker stop $CONTAINER_NAME

            # Live runners keep open-position state in /application/data/state. It lives
            # in the named volume $STATE_VOLUME, which survives docker rm, so a redeploy
            # with open positions keeps their state. One-time migration: on the first
            # deploy that creates the volume, copy the state out of the old container's
            # anonymous volume (the old container is stopped, so files are not mid-write).
            if ! docker volume inspect $STATE_VOLUME >/dev/null 2>&1; then
              docker volume create $STATE_VOLUME
              docker run --rm --volumes-from $CONTAINER_NAME -v $STATE_VOLUME:/dst \
                --entrypoint sh $REGISTRY/koshelevoleg/$IMAGE_NAME:$TAG_NAME \
                -c 'cp -a /application/data/state/. /dst/ && ls -la /dst' \
                || echo "state migration skipped: no old container or empty state"
            fi

            # Remove old container
            docker rm $CONTAINER_NAME

            # Run a new container from a new image
            # RSI_PULLBACK_TOKEN: пока секрет не заведён, подставится пустая строка — воркер
            # rsi_pullback не поднимется (config.RSIPullback.Ready()), остальное приложение
            # и оба воркера reversion работают как обычно.
            docker run -e T_BANK=${{ secrets.T_BANK }} -e PORTFOLIO_YTD_START_VALUE=463402 -e PROFILES=${{ secrets.PROFILES }}  -e REVERSION_TOKEN=${{ secrets.REVERSION_TOKEN }} -e RSI_PULLBACK_TOKEN=${{ secrets.RSI_PULLBACK_TOKEN }} -e SCALPING_ACCOUNT_ID=1 -e TELEGRAM=${{ secrets.TELEGRAM }} -v $STATE_VOLUME:/application/data/state -d -p 50051:50051 --name $CONTAINER_NAME -t $REGISTRY/koshelevoleg/$IMAGE_NAME:$TAG_NAME