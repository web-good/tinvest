version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    environment:
      - QDRANT__SERVICE__HOST=0.0.0.0
      - QDRANT__SERVICE__PORT=6333
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile  # если ваш Dockerfile называется иначе, укажите его здесь
    image: mcp-server-qdrant
    ports:
      - "8001:8001"
    environment:
      FASTMCP_HOST: "localhost"
      QDRANT_URL: "http://localhost:6333"
      QDRANT_API_KEY: "111"
      COLLECTION_NAME: "test"